<!DOCTYPE html>
<html>
<head>
  <title>Update Feedback</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

    <nav>
      <a href="index.html">Submit</a>
      <a href="view.html">View</a>
      <a href="delete.html">Delete</a>
    </nav>

<h2>Update Feedback</h2>

<form id="update-form">
   <input type="number" id="id" required placeholder="ID"><br><br>
   <input type="text" id="name" required placeholder="Name"><br><br>
   <input type="email" id="email" required placeholder="Email"><br><br>
   <input type="text" id="subject" required placeholder="Subject"><br><br>
   <textarea id="message" required placeholder="Message"></textarea><br><br>

   <button type="submit">Update</button>
</form>

<script>
const form = document.getElementById('update-form');

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const id = document.getElementById("id").value;

  if (!id) {
    alert("Please enter an ID");
    return;
  }

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    subject: document.getElementById("subject").value,
    message: document.getElementById("message").value
  };

  const res = await fetch(`http://localhost:4000/feedback/update?feedback_id=${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  if (!res.ok) {
    const text = await res.text();
    alert("Error: " + text);
    return;
  }

  const result = await res.json();
  alert(result.message);
});
</script>

</body>
</html>
